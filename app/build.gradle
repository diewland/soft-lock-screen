apply plugin: 'com.android.application'
android {
    namespace "diewland.screen.off"
    compileSdkVersion 34
    defaultConfig {
        applicationId "diewland.screen.off"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 24
        versionName '2.4'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    productFlavors {
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
}